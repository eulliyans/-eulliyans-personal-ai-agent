
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071923">
  <title>Login | EULLIYAN AI</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">

      <div class="brand">
        <div class="rabbit-icon" aria-label="EULLIYAN AI rabbit mascot">
          🐰
        </div>
        <h1>EULLIYAN <span>AI</span></h1>
        <p>Your Personal AI Business Agent</p>
      </div>

      <div class="welcome">
        <h2>Welcome Back</h2>
        <p>Sign in to continue to your workspace.</p>
      </div>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="togglePassword">Show</button>
        </div>

        <p id="loginMessage" role="status"></p>

        <button type="submit" id="loginButton">
          Sign In
        </button>
        <div style="text-align:right; margin-top:12px;">
  <button
    type="button"
    id="forgotPasswordButton"
    style="background:none; border:none; color:#52D9E8; cursor:pointer;"
  >
    Forgot Password?
  </button>
</div>

<section id="resetSection" hidden>
  <h2>Reset Password</h2>

  <label for="newPassword">New Password</label>
  <input
    type="password"
    id="newPassword"
    placeholder="Enter new password"
    autocomplete="new-password"
  >

  <label for="confirmPassword">Confirm Password</label>
  <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm new password"
    autocomplete="new-password"
  >

  <button type="button" id="resetPasswordButton">
    Update Password
  </button>
</section>
      </form>

      <footer>
        <span>SECURE OWNER ACCESS</span>
        <p>© 2026 EULLIYAN AI</p>
      </footer>

    </section>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
