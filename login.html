
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Login | EULLIYAN AI</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">

      <div class="brand">
        <div class="rabbit-icon" aria-label="EULLIYAN AI rabbit mascot">
          🐰
        </div>
        <h1>EULLIYAN <span>AI</span></h1>
        <p>Your Personal AI Business Agent</p>
      </div>

      <div class="welcome">
        <h2>Welcome Back</h2>
        <p>Sign in to continue to your workspace.</p>
      </div>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="togglePassword">Show</button>
        </div>

        <p id="loginMessage" role="status"></p>

        <button type="submit" id="loginButton">
          Sign In
        </button>
      </form>

      <footer>
        <span>SECURE OWNER ACCESS</span>
        <p>© 2026 EULLIYAN AI</p>
      </footer>

    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
