
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Reset Password | EULLIYAN AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 50% 20%, #29200e, transparent 40%),
        linear-gradient(135deg, #080808, #181818, #090909);
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 40px 30px;
      background: linear-gradient(145deg, #202020, #111);
      border: 1px solid rgba(212,175,55,.3);
      border-radius: 24px;
      box-shadow: 0 25px 70px #000c,
        inset 0 1px 1px #ffffff12;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .rabbit-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      font-size: 35px;
      background: linear-gradient(145deg,#fff4d5,#c9a84c);
      border-radius: 20px;
      box-shadow: 0 8px 22px #d4af3735;
    }

    h1 {
      font-size: 23px;
      letter-spacing: 3px;
    }

    h1 span {
      color: #d4af37;
    }

    .brand p,
    .welcome p {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 24px;
    }

    label {
      display: block;
      color: #d4af37;
      font-size: 13px;
      margin: 18px 0 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      color: white;
      background: #0b0b0b;
      border: 1px solid #383838;
      border-radius: 11px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 12px #d4af3725;
    }

    #resetMessage {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg,#f0d477,#b58b24);
      color: #17120a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
    }

    footer span {
      color: #c5a34a;
      font-size: 10px;
      letter-spacing: 2px;
    }

    footer p {
      margin-top: 10px;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="login-page">
    <section class="login-card">

      <div class="brand">
        <div class="rabbit-icon">🐇</div>
        <h1>EULLIYAN <span>AI</span></h1>
        <p>Your Personal AI Business Agent</p>
      </div>

      <div class="welcome">
        <h2>Create New Password</h2>
        <p>Choose a strong password for your owner account.</p>
      </div>

      <form id="resetForm">

        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <p id="resetMessage" role="status"></p>

        <button type="submit" id="resetButton">
          Update Password
        </button>

      </form>

      <footer>
        <span>SECURE OWNER ACCESS</span>
        <p>© 2026 EULLIYAN AI</p>
      </footer>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const OWNER_ID = "da203003-ec49-4675-8c6a-740f5fd3b6c5";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("resetMessage");
    const button = document.getElementById("resetButton");

    let recoveryVerified = false;

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#6ee7a0" : "#ff7777";
    }

    async function initializeRecovery() {
      try {
        const hash = new URLSearchParams(
          window.location.hash.substring(1)
        );

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        const recoveryError = hash.get("error_description");

        if (recoveryError) {
          throw new Error(recoveryError);
        }

        if (accessToken && refreshToken) {
          const { data, error } =
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

          if (error) throw error;

          if (!data.user || data.user.id !== OWNER_ID) {
            await supabaseClient.auth.signOut();
            throw new Error("Owner account verification failed.");
          }

          recoveryVerified = true;
          showMessage("Recovery verified. Set your new password.", true);
          return;
        }

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session?.user?.id === OWNER_ID) {
          recoveryVerified = true;
          showMessage("Owner verified. Set your new password.", true);
          return;
        }

        throw new Error("Invalid or expired recovery link. Request a new one.");

      } catch (error) {
        recoveryVerified = false;
        button.disabled = true;
        showMessage(error.message);
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) {
        showMessage("Please use a valid password recovery link.");
        return;
      }

      const password =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) throw error;

        if (!data.user || data.user.id !== OWNER_ID) {
          throw new Error("Owner verification failed.");
        }

        await supabaseClient.auth.signOut();

        showMessage("Password updated successfully! Redirecting to login...", true);

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 2000);

      } catch (error) {
        showMessage(error.message);
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    initializeRecovery();
  </script>

</body>
</html>
